name: Backend Django QA

on:
  push:
    branches:
      - feature/backend-django
  workflow_dispatch:

jobs:
  django-qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: activa_mayor
          POSTGRES_USER: activa_mayor
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U activa_mayor -d activa_mayor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "false"
      DB_NAME: activa_mayor
      DB_USER: activa_mayor
      DB_PASSWORD: test-only-password
      DB_HOST: localhost
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Django check
        run: python manage.py check
      - name: Generar migraciones iniciales (verificación temporal)
        run: python manage.py makemigrations cuentas instituciones participantes actividades inscripciones --noinput
      - name: Aplicar migraciones en PostgreSQL
        run: python manage.py migrate --noinput
      - name: Ejecutar pruebas
        run: python manage.py test --verbosity 2
